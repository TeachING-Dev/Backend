 name: CI
 on:
  pull_request:
    branches: [main]
 permissions:
   contents: read
 jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
            cache: gradle
        - run: chmod +x ./gradlew
        - run: ./gradlew --no-daemon clean test