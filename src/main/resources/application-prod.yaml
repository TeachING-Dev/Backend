server:
  forward-headers-strategy: framework

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME:teaching-db}?useSSL=true&requireSSL=true&verifyServerCertificate=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY}
    expiration:
      access: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
      refresh: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

app:
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI}

  icon-base-url: ${ICON_BASE_URL}

  teacher-image-base-url: ${TEACHER_IMAGE_BASE_URL}


cookie:
  secure: true
  domain: teachingg.site

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.teachingg.site,http://localhost:5173}

support:
  kakao-channel-url: ${SUPPORT_KAKAO_CHANNEL_URL:https://pf.kakao.com/_teaching}
  email: ${SUPPORT_EMAIL:support@teaching.com}

kakaopay:
  cid: ${KAKAOPAY_CID}
  secret-key: ${KAKAOPAY_SECRET_KEY}
  base-url: ${KAKAOPAY_BASE_URL:https://open-api.kakaopay.com}
  item-name: ${KAKAOPAY_ITEM_NAME:TeachING Plus 구독}
  amount: ${KAKAOPAY_AMOUNT:5900}
  callback-base-url: ${KAKAOPAY_CALLBACK_BASE_URL}
  frontend-base-url: ${KAKAOPAY_FRONTEND_BASE_URL:https://www.teachingg.site}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION:ap-northeast-2}

openai:
  api-key: ${OPENAI_API_KEY}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

qdrant:
  url: ${QDRANT_URL}
  api-key: ${QDRANT_API_KEY}
  collection-name: ${QDRANT_COLLECTION_NAME}
  vector-size: ${QDRANT_VECTOR_SIZE:1536}

material:
  indexing:
    chunk-size: ${MATERIAL_INDEXING_CHUNK_SIZE:900}
    chunk-overlap: ${MATERIAL_INDEXING_CHUNK_OVERLAP:150}

rag:
  # 자료당 대표 청크 1개만 넘기던 제한을 없애면서(청크 검색은 그대로 topK개 청크, 메타/제목-태그
  # 검색은 topK개 "자료"의 모든 청크) 후보 자료 수가 부족하면 실제 답이 있는 자료가 아예 후보에서
  # 빠질 수 있어, 자료 22개 이상 보유한 유저 기준으로 여유를 두고 5 -> 8로 상향 (2026-08-02)
  top-k: ${RAG_TOP_K:8}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.3}
  metadata-similarity-threshold: ${RAG_METADATA_SIMILARITY_THRESHOLD:0.3}
